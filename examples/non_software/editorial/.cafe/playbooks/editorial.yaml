playbook:
  id: editorial
  name: "Editorial Workflow"

roles:
  editor:
    description: "Content Editor"
    default_agent: "Roger"
    default_cli: "gemini"
  writer:
    description: "Writer"
    default_agent: "David"
    default_cli: "claude"

steps:
  brief:
    skill:
      "1": brief_first
      default: brief_revise
    role: editor
    output_artifact: brief
    valid_intents:
      - confirmed
      - need_clarification
      - ready_for_review
    "on":
      await_agent: draft
      need_clarification: brief
      confirm_output: brief

  draft:
    skill: draft
    role: writer
    input_artifacts: [brief]
    output_artifact: manuscript
    valid_intents:
      - confirmed
      - need_clarification
    "on":
      await_agent: review
      need_clarification: draft

  review:
    skill: editorial_review
    role: editor
    input_artifacts: [brief, manuscript]
    output_artifact: review_feedback
    valid_intents:
      - confirmed
      - needs_changes
    allowed_goto: [brief, draft]
    "on":
      await_agent: publish
      manual_handoff: draft

  publish:
    skill: publish
    role: writer
    input_artifacts: [brief, manuscript, review_feedback]
    output_artifact: published_piece
    valid_intents:
      - confirmed
    "on":
      await_agent: _done

entry_point: brief
