playbook:
  id: simple
  name: "Simple Workflow"
  conversation_locale: en-US
  applicability:
    summary: "Requirement-led delivery for bounded work that needs independent acceptance testing."
    use_when:
      - "The outcome needs requirement clarification and independent acceptance evidence."
      - "The solution is straightforward enough to proceed without a separate implementation plan."
    avoid_when:
      - "The change needs independent code review as a required responsibility."
      - "Architecture or sequencing requires a dedicated planning phase."

behavior:
  completion: status_code
  allow_issue_decomposition: true

skills:
  workflow:
    shared: [cafe-workflow-common, cafe-github_sync]
  chat:
    shared: [cafe-common-chat-handoff, cafe-chat-develop-change, cafe-chat-spec-revision, cafe-chat-plan-revision, cafe-chat-alignment-decision]

roles:
  pm:
    description: "Product Manager"
    default_agent: "Roger"
    default_cli: "gemini"
  developer:
    description: "Developer"
    default_agent: "David"
    default_cli: "claude"
  qa:
    description: "Product Acceptance QA"
    default_agent: "Quinn"
    default_cli: "gemini"

commands:
  prepare:
    fields_ref: skill://cafe-spec/assets/prepare/default_prepare_fields.yaml

steps:
  spec:
    type: skill
    skill: cafe-spec
    role: pm
    assignee_type: agent
    input_artifacts: []
    output_artifact: spec
    initial_input:
      providers: [manual_text, github_issue]
      bind:
        artifact: spec
        prompt_context: user_input
      legacy_presentation: true
    human_tasks:
      - trigger: confirm_output
        task_id: output-review
        outcomes: {confirm: develop, revise: spec}
      - trigger: need_clarification
        task_id: clarification-answers
        outcomes: {submit: spec}
    allowed_tools: [Read, Grep, Glob, WebFetch, WebSearch]
    hooks:
      prepare_input: [InitialInputProviderResolver, UserInputCollector]
      after_execute: [InteractiveQAHandler]
    "on":
      confirm_output: spec
      need_clarification: spec
      need_permission: spec
      await_agent: develop

  develop:
    type: skill
    skill: cafe-develop
    handoff_label: Continue implementation
    role: developer
    assignee_type: agent
    input_artifacts: [spec, qa_feedback, workflow_feedback, delivery_result]
    output_artifact: code
    workspace_artifact: workspace
    human_tasks:
      - trigger: need_clarification
        task_id: clarification-feedback
        outcomes: {submit: develop}
      - trigger: need_permission
        task_id: permission-answers
        outcomes: {submit: develop}
      - trigger: no_changes_needed
        task_id: no-change-decision
        outcomes: {agree: qa, disagree: develop}
    allowed_tools: [Read, Edit, Write, Grep, Glob, Bash, WebFetch, WebSearch]
    hooks:
      prepare_input: [UserInputCollector]
      after_execute: [NoChangesNeededHandler, PermissionRetryHandler]
    "on":
      await_agent: qa
      need_clarification: develop
      need_permission: develop
      no_changes_needed: qa

  qa:
    type: skill
    skill: cafe-qa
    role: qa
    assignee_type: agent
    input_artifacts: [spec, code, workspace]
    workspace_input_artifact: workspace
    output_artifact: qa_feedback
    human_tasks:
      - trigger: need_clarification
        task_id: clarification-feedback
        outcomes: {submit: qa}
      - trigger: manual_handoff
        task_id: iteration-limit
        outcomes: {resume: qa}
    allowed_tools: [Read, Grep, Glob, Bash]
    max_attempts_per_cycle: 5
    allowed_goto: [develop]
    hooks:
      prepare_input: [UserInputCollector]
    "on":
      await_agent: pr
      manual_handoff: develop
      need_clarification: qa
      need_permission: qa

  pr:
    handoff_label: Revise PR content
    type: skill
    skill: cafe-pr
    role: developer
    assignee_type: agent
    input_artifacts:
    - spec
    - code
    - workspace
    - qa_feedback
    - workflow_feedback
    workspace_input_artifact: workspace
    output_artifact: pr_result
    behavior:
      completion: baton
      publish_confirmation: true
      feedback_target: pr
      feedback_artifact: workflow_feedback
      feedback_source_kind: github_pr
      feedback_todo_source: pr_comment
      feedback_todo_id_prefix: PRC
      context_providers:
      - git_history
      - local_review
    capability_requests:
    - cafe.pr.publish
    allowed_tools:
    - Read
    - Edit
    - Write
    - Grep
    - Glob
    allowed_goto:
    - develop
    hooks:
      prepare_input:
      - GitHubPRCreator
      - GitHubPRFeedbackSource
      - UserInputCollector
      publish_output:
      - GitHubPRCreator
      - LocalReviewContextProvider
      - PRLinkOpener
    human_tasks:
    - trigger: confirm_output
      task_id: pr-review
      outcomes:
        fix_now: pr
        confirm: deliver
    - trigger: need_clarification
      task_id: pr-details
      outcomes:
        submit: pr
    'on':
      confirm_output: pr
      need_permission: pr
      manual_handoff: develop
      need_clarification: pr
  deliver:
    type: skill
    skill: cafe-deliver_development
    handoff_label: Recover delivery actions
    role: developer
    assignee_type: agent
    input_artifacts:
    - pr_result
    - workspace
    - workflow_feedback
    workspace_input_artifact: workspace
    output_artifact: delivery_result
    delivery:
      actions_artifact: delivery_actions
      result_artifact: delivery_result
      approval_step: deliver
      approval_task: delivery-review
      result_task: delivery-outcome
      correction_step: develop
      publication_artifact: pr_result
    behavior:
      completion: baton
      feedback_target: develop
      feedback_artifact: delivery_result
      feedback_source_kind: delivery
      feedback_todo_source: workflow_feedback
      feedback_todo_id_prefix: DLV
    capability_requests:
    - cafe.github.pr.merge
    - cafe.branch.integrate
    - cafe.github.issue.create
    allowed_tools:
    - Read
    - Edit
    - Write
    - Grep
    - Glob
    allowed_goto:
    - develop
    - pr
    hooks:
      prepare_input:
      - DevelopmentDeliveryExecutor
      publish_output:
      - DevelopmentActionContext
      - DevelopmentDeliveryOutcome
    human_tasks:
    - trigger: confirm_output
      task_id: delivery-outcome
      feedback_delivery: {artifact: workflow_feedback, source_kind: delivery, todo_source: workflow_feedback, todo_id_prefix: DLV}
      outcomes:
        confirm_cleanup: _done
        confirm_archive: _done
        confirm: _done
        revise: deliver
    - trigger: need_clarification
      task_id: delivery-recovery
      outcomes:
        submit: deliver
    - trigger: need_permission
      task_id: delivery-review
      outcomes:
        fix_now: deliver
        integrate_selected: deliver
        integrate_only: deliver
        review_only: deliver
      feedback_delivery: {artifact: workflow_feedback, source_kind: delivery, todo_source: workflow_feedback, todo_id_prefix: DLV}
    'on':
      confirm_output: deliver
      need_clarification: deliver
      need_permission: deliver
      manual_handoff: develop

entry_point: spec
