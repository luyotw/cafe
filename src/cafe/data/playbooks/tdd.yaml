playbook:
  id: tdd
  name: "Test-Driven Development Workflow"
  conversation_locale: en-US
  applicability:
    summary: "Test-driven software delivery with planned scope and independent code review."
    use_when:
      - "Repository policy or confirmed risk requires tests to drive implementation."
      - "Independent code review covers the confirmed acceptance boundary."
    avoid_when:
      - "The work does not require a test-first development method."
      - "Independent black-box acceptance requires a separate QA owner."

behavior:
  completion: status_code
  allow_issue_decomposition: true

skills:
  workflow:
    shared: [cafe-workflow-common, cafe-github_sync]
  chat:
    shared: [cafe-common-chat-handoff, cafe-chat-develop-change, cafe-chat-spec-revision, cafe-chat-plan-revision, cafe-chat-alignment-decision]

roles:
  pm:
    description: "Product Manager"
    default_agent: "Roger"
    default_cli: "gemini"
  developer:
    description: "Developer"
    default_agent: "Nick"
    default_cli: "claude"
  reviewer:
    description: "Code Reviewer"
    default_agent: "Richard"
    default_cli: "gemini"

commands:
  prepare:
    fields_ref: skill://cafe-spec/assets/prepare/default_prepare_fields.yaml

steps:
  spec:
    type: skill
    skill: cafe-spec
    role: pm
    handoff_label: "Update requirements spec"
    chat_role: pm
    assignee_type: agent
    input_artifacts: []
    output_artifact: spec
    initial_input:
      providers: [manual_text, github_issue]
      bind:
        artifact: spec
        prompt_context: user_input
      legacy_presentation: true
    human_tasks:
      - trigger: confirm_output
        task_id: output-review
        outcomes: {confirm: plan, revise: spec}
      - trigger: need_clarification
        task_id: clarification-answers
        outcomes: {submit: spec}
    allowed_tools: [Read, Grep, Glob, WebFetch, WebSearch]
    hooks:
      prepare_input: [InitialInputProviderResolver, UserInputCollector]
      after_execute: [InteractiveQAHandler]
    "on":
      confirm_output: spec
      need_clarification: spec
      need_permission: spec
      await_agent: plan

  plan:
    type: skill
    skill: cafe-plan
    role: developer
    handoff_label: "Revise implementation plan"
    chat_role: developer
    assignee_type: agent
    input_artifacts: [spec, plan]
    output_artifact: plan
    todo_identity_input_artifact: plan
    human_tasks:
      - trigger: initial
        task_id: development-guide
      - trigger: confirm_output
        task_id: output-review
        outcomes: {confirm: develop, revise: plan}
      - trigger: need_clarification
        task_id: clarification-answers
        outcomes: {submit: plan}
    allowed_tools: [Read, Grep, Glob, WebFetch, WebSearch]
    hooks:
      prepare_input: [UserInputCollector]
    "on":
      confirm_output: plan
      need_clarification: plan
      need_permission: plan
      await_agent: develop

  develop:
    type: skill
    skill: cafe-develop
    role: developer
    handoff_label: "Continue implementation"
    chat_role: developer
    assignee_type: agent
    input_artifacts: [spec, plan, review_feedback, pr_result, workflow_feedback, delivery_result]
    output_artifact: code
    workspace_artifact: workspace
    human_tasks:
      - trigger: need_clarification
        task_id: clarification-feedback
        outcomes: {submit: develop}
      - trigger: need_permission
        task_id: permission-answers
        outcomes: {submit: develop}
      - trigger: no_changes_needed
        task_id: no-change-decision
        outcomes: {agree: pr, disagree: develop}
    allowed_tools: [Read, Edit, Write, Grep, Glob, Bash, WebFetch, WebSearch]
    hooks:
      prepare_input: [UserInputCollector]
      after_execute: [NoChangesNeededHandler, PermissionRetryHandler]
    "on":
      await_agent: review
      manual_handoff: pr
      need_clarification: develop
      need_permission: develop
      no_changes_needed: review

  review:
    type: skill
    skill: cafe-review
    role: reviewer
    behavior:
      runtime_tool_grants: [web_research, git_inspection]
    handoff_label: "Run review again"
    chat_role: reviewer
    assignee_type: agent
    input_artifacts: [spec, plan, code, workspace, workflow_feedback]
    workspace_input_artifact: workspace
    output_artifact: review_feedback
    human_tasks:
      - trigger: need_clarification
        task_id: clarification-feedback
        outcomes: {submit: review}
      - trigger: manual_handoff
        task_id: iteration-limit
        outcomes: {resume: review}
    allowed_tools: [Read, Grep, Glob, "Bash(git:*)"]
    max_attempts_per_cycle: 5
    allowed_goto: [spec, develop, plan]
    hooks:
      prepare_input: [UserInputCollector]
      before_execute: [NewChangesGate]
    "on":
      await_agent: pr
      manual_handoff: develop
      need_clarification: review

  pr:
    handoff_label: Revise PR content
    type: skill
    skill: cafe-pr
    role: developer
    handoff_label: Refresh PR output
    chat_role: developer
    assignee_type: agent
    input_artifacts:
    - spec
    - plan
    - code
    - workspace
    - review_feedback
    - workflow_feedback
    workspace_input_artifact: workspace
    output_artifact: pr_result
    behavior:
      completion: baton
      publish_confirmation: true
      feedback_target: pr
      feedback_artifact: workflow_feedback
      feedback_source_kind: github_pr
      feedback_todo_source: pr_comment
      feedback_todo_id_prefix: PRC
      context_providers:
      - git_history
      - local_review
    capability_requests:
    - cafe.pr.publish
    allowed_tools:
    - Read
    - Edit
    - Write
    - Grep
    - Glob
    allowed_goto:
    - develop
    - review
    hooks:
      prepare_input:
      - GitHubPRCreator
      - GitHubPRFeedbackSource
      - UserInputCollector
      publish_output:
      - GitHubPRCreator
      - LocalReviewContextProvider
      - PRLinkOpener
    human_tasks:
    - trigger: confirm_output
      task_id: pr-review
      outcomes:
        fix_now: pr
        confirm: deliver
    - trigger: need_clarification
      task_id: pr-details
      outcomes:
        submit: pr
    'on':
      confirm_output: pr
      need_permission: pr
      manual_handoff: develop
      need_clarification: pr
  deliver:
    type: skill
    skill: cafe-deliver_development
    handoff_label: Recover delivery actions
    role: developer
    assignee_type: agent
    input_artifacts:
    - review_feedback
    - pr_result
    - workspace
    - workflow_feedback
    workspace_input_artifact: workspace
    output_artifact: delivery_result
    delivery:
      actions_artifact: delivery_actions
      result_artifact: delivery_result
      approval_step: deliver
      approval_task: delivery-review
      result_task: delivery-outcome
      correction_step: develop
      proposals_artifact: review_feedback
      publication_artifact: pr_result
    behavior:
      completion: baton
      feedback_target: develop
      feedback_artifact: delivery_result
      feedback_source_kind: delivery
      feedback_todo_source: workflow_feedback
      feedback_todo_id_prefix: DLV
    capability_requests:
    - cafe.github.pr.merge
    - cafe.branch.integrate
    - cafe.github.issue.create
    allowed_tools:
    - Read
    - Edit
    - Write
    - Grep
    - Glob
    allowed_goto:
    - develop
    - pr
    hooks:
      prepare_input:
      - DevelopmentDeliveryExecutor
      publish_output:
      - DevelopmentActionContext
      - DevelopmentDeliveryOutcome
    human_tasks:
    - trigger: confirm_output
      task_id: delivery-outcome
      feedback_delivery: {artifact: workflow_feedback, source_kind: delivery, todo_source: workflow_feedback, todo_id_prefix: DLV}
      outcomes:
        confirm_cleanup: _done
        confirm_archive: _done
        confirm: _done
        revise: deliver
    - trigger: need_clarification
      task_id: delivery-recovery
      outcomes:
        submit: deliver
    - trigger: need_permission
      task_id: delivery-review
      outcomes:
        fix_now: deliver
        integrate_selected: deliver
        integrate_only: deliver
        review_only: deliver
      feedback_delivery: {artifact: workflow_feedback, source_kind: delivery, todo_source: workflow_feedback, todo_id_prefix: DLV}
    'on':
      confirm_output: deliver
      need_clarification: deliver
      need_permission: deliver
      manual_handoff: develop

entry_point: spec
