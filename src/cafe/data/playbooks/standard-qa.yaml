playbook:
  id: standard-qa
  name: "Standard Development + QA"
  conversation_locale: en-US
  applicability:
    summary: "Planned software delivery with independent code review and acceptance testing."
    use_when:
      - "Requirements and implementation sequencing need dedicated ownership."
      - "Acceptance must be verified independently from implementation and code review."
    avoid_when:
      - "Repository policy requires test-driven implementation throughout development."
      - "Implementation verification and code review fully cover the acceptance boundary."

behavior:
  completion: status_code
  allow_issue_decomposition: true

skills:
  workflow:
    shared: [cafe-workflow-common, cafe-github_sync]
  chat:
    shared: [cafe-common-chat-handoff, cafe-chat-develop-change, cafe-chat-spec-revision, cafe-chat-plan-revision, cafe-chat-alignment-decision]

roles:
  pm: {description: "Product Manager", default_agent: Roger, default_cli: gemini}
  developer: {description: Developer, default_agent: David, default_cli: claude}
  reviewer: {description: "Code Reviewer", default_agent: Richard, default_cli: gemini}
  qa: {description: "Product Acceptance QA", default_agent: Quinn, default_cli: gemini}

commands:
  prepare:
    fields_ref: skill://cafe-spec/assets/prepare/default_prepare_fields.yaml

steps:
  spec:
    type: skill
    skill: cafe-spec
    role: pm
    assignee_type: agent
    input_artifacts: []
    output_artifact: spec
    initial_input:
      providers: [manual_text, github_issue]
      bind: {artifact: spec, prompt_context: user_input}
      legacy_presentation: true
    human_tasks:
      - {trigger: confirm_output, task_id: output-review, outcomes: {confirm: plan, revise: spec}}
      - {trigger: need_clarification, task_id: clarification-answers, outcomes: {submit: spec}}
    allowed_tools: [Read, Grep, Glob, WebFetch, WebSearch]
    hooks:
      prepare_input: [InitialInputProviderResolver, UserInputCollector]
      after_execute: [InteractiveQAHandler]
    "on": {confirm_output: spec, need_clarification: spec, need_permission: spec, await_agent: plan}

  plan:
    type: skill
    skill: cafe-plan
    role: developer
    assignee_type: agent
    input_artifacts: [spec, plan]
    output_artifact: plan
    todo_identity_input_artifact: plan
    human_tasks:
      - {trigger: initial, task_id: development-guide}
      - {trigger: confirm_output, task_id: output-review, outcomes: {confirm: develop, revise: plan}}
      - {trigger: need_clarification, task_id: clarification-answers, outcomes: {submit: plan}}
    allowed_tools: [Read, Grep, Glob, WebFetch, WebSearch]
    hooks: {prepare_input: [UserInputCollector]}
    "on": {confirm_output: plan, need_clarification: plan, need_permission: plan, await_agent: develop}

  develop:
    type: skill
    skill: cafe-develop
    handoff_label: Continue implementation
    role: developer
    input_artifacts: [spec, plan, review_feedback, qa_feedback, pr_result, workflow_feedback, delivery_result]
    workspace_artifact: workspace
    human_tasks:
      - {trigger: need_clarification, task_id: clarification-feedback, outcomes: {submit: develop}}
      - {trigger: need_permission, task_id: permission-answers, outcomes: {submit: develop}}
      - {trigger: no_changes_needed, task_id: no-change-decision, outcomes: {agree: review, disagree: develop}}
    "on": {await_agent: review, need_clarification: develop, need_permission: develop, no_changes_needed: review}

  review:
    type: skill
    skill: cafe-review
    role: reviewer
    input_artifacts: [spec, plan, code, workspace, qa_feedback, workflow_feedback]
    workspace_input_artifact: workspace
    behavior: {runtime_tool_grants: [git_inspection]}
    human_tasks:
      - {trigger: need_clarification, task_id: clarification-feedback, outcomes: {submit: review}}
      - {trigger: manual_handoff, task_id: iteration-limit, outcomes: {resume: review}}
    allowed_goto: [develop]
    "on": {await_agent: qa, manual_handoff: develop, need_clarification: review}

  qa:
    type: skill
    skill: cafe-qa
    role: qa
    input_artifacts: [spec, plan, code, workspace, review_feedback]
    workspace_input_artifact: workspace
    human_tasks:
      - {trigger: need_clarification, task_id: clarification-feedback, outcomes: {submit: qa}}
      - {trigger: manual_handoff, task_id: iteration-limit, outcomes: {resume: qa}}
    allowed_goto: [develop]
    "on": {await_agent: pr, manual_handoff: develop, need_clarification: qa, need_permission: qa}

  pr:
    handoff_label: Revise PR content
    type: skill
    skill: cafe-pr
    role: developer
    input_artifacts:
    - spec
    - plan
    - code
    - workspace
    - review_feedback
    - qa_feedback
    - workflow_feedback
    workspace_input_artifact: workspace
    behavior:
      feedback_target: pr
      feedback_artifact: workflow_feedback
      feedback_source_kind: github_pr
      feedback_todo_source: pr_comment
      feedback_todo_id_prefix: PRC
    capability_requests:
    - cafe.pr.publish
    allowed_goto:
    - develop
    human_tasks:
    - trigger: confirm_output
      task_id: pr-review
      mandatory_confirmation: false
      feedback_delivery: {artifact: workflow_feedback, source_kind: local_review, todo_source: workflow_feedback, todo_id_prefix: WF}
      outcomes:
        fix_now: pr
        confirm: deliver
    - trigger: need_clarification
      task_id: pr-details
      outcomes:
        submit: pr
    'on':
      confirm_output: pr
      need_permission: pr
      manual_handoff: develop
      need_clarification: pr
  deliver:
    type: skill
    skill: cafe-deliver_development
    handoff_label: Recover delivery actions
    role: developer
    assignee_type: agent
    input_artifacts:
    - review_feedback
    - pr_result
    - workspace
    - workflow_feedback
    workspace_input_artifact: workspace
    output_artifact: delivery_result
    delivery:
      actions_artifact: delivery_actions
      result_artifact: delivery_result
      approval_step: deliver
      approval_task: delivery-review
      result_task: delivery-outcome
      correction_step: develop
      proposals_artifact: review_feedback
      publication_artifact: pr_result
    behavior:
      completion: baton
      feedback_target: develop
      feedback_artifact: delivery_result
      feedback_source_kind: delivery
      feedback_todo_source: workflow_feedback
      feedback_todo_id_prefix: DLV
    capability_requests:
    - cafe.github.pr.merge
    - cafe.branch.integrate
    - cafe.github.issue.create
    allowed_tools:
    - Read
    - Edit
    - Write
    - Grep
    - Glob
    allowed_goto:
    - develop
    - pr
    hooks:
      prepare_input:
      - DevelopmentDeliveryExecutor
      publish_output:
      - DevelopmentActionContext
      - DevelopmentDeliveryOutcome
    human_tasks:
    - trigger: confirm_output
      task_id: delivery-outcome
      feedback_delivery: {artifact: workflow_feedback, source_kind: delivery, todo_source: workflow_feedback, todo_id_prefix: DLV}
      outcomes:
        confirm_cleanup: _done
        confirm_archive: _done
        confirm: _done
        revise: deliver
    - trigger: need_clarification
      task_id: delivery-recovery
      outcomes:
        submit: deliver
    - trigger: need_permission
      task_id: delivery-review
      outcomes:
        fix_now: deliver
        integrate_selected: deliver
        integrate_only: deliver
        review_only: deliver
      feedback_delivery: {artifact: workflow_feedback, source_kind: delivery, todo_source: workflow_feedback, todo_id_prefix: DLV}
    'on':
      confirm_output: deliver
      need_clarification: deliver
      need_permission: deliver
      manual_handoff: develop

entry_point: spec
