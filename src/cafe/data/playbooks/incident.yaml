playbook:
  id: incident
  name: "Incident Response Workflow（偵測 → 分類 → 緩解 → 事後檢討）"
  conversation_locale: en-US

skills:
  workflow:
    shared: [cafe-workflow-common, cafe-github_sync]
  chat:
    shared: [cafe-common-chat-handoff, cafe-chat-develop-change, cafe-chat-spec-revision, cafe-chat-plan-revision, cafe-chat-alignment-decision]

roles:
  ops:
    description: "值班／維運應變"
    default_agent: "Casey"
    default_cli: "claude"

commands:
  prepare:
    prompt_for_spec_plan_config: false

steps:
  detect:
    type: skill
    skill: cafe-incident_detect
    role: ops
    assignee_type: agent
    output_artifact: incident_signal
    human_tasks:
      - trigger: need_clarification
        task_id: clarification-feedback
        outcomes: {submit: detect}
    valid_intents:
      - confirmed
      - need_clarification
    allowed_tools: [Read, Grep, Glob, Bash, WebFetch, WebSearch]
    "on":
      await_agent: triage
      need_clarification: detect

  triage:
    type: skill
    skill: cafe-incident_triage
    role: ops
    assignee_type: agent
    input_artifacts: [incident_signal]
    output_artifact: incident_plan
    human_tasks:
      - trigger: need_clarification
        task_id: clarification-feedback
        outcomes: {submit: triage}
    valid_intents:
      - confirmed
      - need_clarification
    allowed_tools: [Read, Grep, Glob, Bash]
    "on":
      await_agent: mitigate
      need_clarification: triage
      manual_handoff: detect

  mitigate:
    type: skill
    skill: cafe-incident_mitigate
    role: ops
    assignee_type: agent
    input_artifacts: [incident_signal, incident_plan]
    output_artifact: incident_recovery
    human_tasks:
      - trigger: need_clarification
        task_id: clarification-feedback
        outcomes: {submit: mitigate}
    valid_intents:
      - confirmed
      - need_clarification
    allowed_tools: [Read, Edit, Write, Grep, Glob, Bash]
    "on":
      await_agent: postmortem
      need_clarification: mitigate
      manual_handoff: triage

  postmortem:
    type: skill
    skill: cafe-incident_postmortem
    role: ops
    assignee_type: agent
    input_artifacts: [incident_signal, incident_plan, incident_recovery]
    output_artifact: incident_learning
    human_tasks:
      - trigger: need_clarification
        task_id: clarification-feedback
        outcomes: {submit: postmortem}
    valid_intents:
      - confirmed
      - need_clarification
    allowed_tools: [Read, Edit, Write, Grep, Glob]
    "on":
      await_agent: _done
      need_clarification: postmortem
      manual_handoff: triage

entry_point: detect
