playbook:
  id: hotfix
  name: "Hotfix Workflow"
  conversation_locale: en-US
  applicability:
    summary: "Urgent, tightly bounded production correction with independent code review."
    use_when:
      - "A confirmed production defect needs a minimal, time-sensitive correction."
      - "The rollback and regression boundaries are already understood."
    avoid_when:
      - "The request includes unconfirmed product scope or architectural change."
      - "Acceptance requires broader independent QA or exploratory validation."

behavior:
  completion: status_code
  allow_issue_decomposition: true

skills:
  workflow:
    shared: [cafe-workflow-common, cafe-github_sync]
  chat:
    shared: [cafe-common-chat-handoff, cafe-chat-develop-change, cafe-chat-spec-revision, cafe-chat-plan-revision, cafe-chat-alignment-decision]

roles:
  developer:
    description: "Developer"
    default_agent: "David"
    default_cli: "claude"
  reviewer:
    description: "Code Reviewer"
    default_agent: "Richard"
    default_cli: "gemini"

commands:
  prepare:
    prompt_for_spec_plan_config: false
    setup_modes:
      quick:
        enabled: true
        label: "Quick setup (use recommended defaults)"
      custom:
        enabled: true
        label: "Custom configuration"
    quick_setup:
      spec:
        rigor: medium
        template: auto
      plan:
        template: auto
      sync_github:
        when_issue_id_present: true
        when_manual_input: false
      pr:
        auto_create_on_github_repo: true
        post_todo_list_when_auto_create: true
    non_interactive_defaults:
      rigor: medium
      spec_template: auto
      plan_template: default
    input_method:
      prompt_on_github_repo: true
      non_github_default: manual
    constraints:
      rigor: [low, medium, high]

steps:
  develop:
    type: skill
    skill: cafe-develop
    handoff_label: Continue implementation
    role: developer
    assignee_type: agent
    input_artifacts: [review_feedback, pr_result, workflow_feedback, delivery_result]
    output_artifact: code
    workspace_artifact: workspace
    human_tasks:
      - trigger: need_clarification
        task_id: clarification-feedback
        outcomes: {submit: develop}
      - trigger: need_permission
        task_id: permission-answers
        outcomes: {submit: develop}
    allowed_tools: [Read, Edit, Write, Grep, Glob, Bash, WebFetch, WebSearch]
    hooks:
      prepare_input: [UserInputCollector]
      after_execute: [PermissionRetryHandler]
    "on":
      await_agent: review
      manual_handoff: pr
      need_clarification: develop
      need_permission: develop

  review:
    type: skill
    skill: cafe-review
    handoff_label: Run review again
    role: reviewer
    behavior:
      runtime_tool_grants: [web_research, git_inspection]
    assignee_type: agent
    input_artifacts: [code, workspace, workflow_feedback]
    workspace_input_artifact: workspace
    output_artifact: review_feedback
    human_tasks:
      - trigger: need_clarification
        task_id: clarification-feedback
        outcomes: {submit: review}
      - trigger: manual_handoff
        task_id: iteration-limit
        outcomes: {resume: review}
    allowed_tools: [Read, Grep, Glob, "Bash(git:*)"]
    max_attempts_per_cycle: 1
    allowed_goto: [develop]
    hooks:
      prepare_input: [UserInputCollector]
      before_execute: [NewChangesGate]
    "on":
      await_agent: pr
      manual_handoff: develop
      need_clarification: review

  pr:
    handoff_label: Revise PR action review
    type: skill
    skill: cafe-pr
    role: developer
    assignee_type: agent
    input_artifacts:
    - code
    - workspace
    - review_feedback
    - workflow_feedback
    workspace_input_artifact: workspace
    output_artifact: pr_result
    behavior:
      completion: baton
      publish_confirmation: true
      feedback_target: pr
      feedback_artifact: workflow_feedback
      feedback_source_kind: github_pr
      feedback_todo_source: pr_comment
      feedback_todo_id_prefix: PRC
      context_providers:
      - git_history
      - local_review
    capability_requests:
    - cafe.pr.publish
    allowed_tools:
    - Read
    - Edit
    - Write
    - Grep
    - Glob
    allowed_goto:
    - develop
    - review
    hooks:
      prepare_input:
      - GitHubPRCreator
      - GitHubPRFeedbackSource
      - UserInputCollector
      publish_output:
      - GitHubPRCreator
      - LocalReviewContextProvider
      - PRLinkOpener
      - DevelopmentActionContext
    human_tasks:
    - trigger: confirm_output
      task_id: delivery-review
      outcomes:
        fix_now: pr
        integrate_selected: deliver
        integrate_only: deliver
        review_only: pr
      feedback_delivery:
        artifact: workflow_feedback
        source_kind: local_review
        todo_source: workflow_feedback
        todo_id_prefix: WF
    - trigger: need_clarification
      task_id: delivery-details
      outcomes:
        submit: pr
    'on':
      confirm_output: pr
      need_permission: pr
      manual_handoff: develop
      need_clarification: pr
    delivery: &id001
      actions_artifact: delivery_actions
      result_artifact: delivery_result
      approval_step: pr
      approval_task: delivery-review
      result_task: delivery-outcome
      correction_step: develop
      proposals_artifact: review_feedback
  deliver:
    type: skill
    skill: cafe-deliver_development
    handoff_label: Recover delivery actions
    role: developer
    assignee_type: agent
    input_artifacts:
    - pr_result
    - workspace
    - delivery_actions
    - workflow_feedback
    workspace_input_artifact: workspace
    output_artifact: delivery_result
    delivery: *id001
    behavior:
      completion: baton
      feedback_target: develop
      feedback_artifact: delivery_result
      feedback_source_kind: delivery
      feedback_todo_source: workflow_feedback
      feedback_todo_id_prefix: DLV
    capability_requests:
    - cafe.github.pr.merge
    - cafe.branch.integrate
    - cafe.github.issue.create
    allowed_tools:
    - Read
    - Edit
    - Write
    - Grep
    - Glob
    allowed_goto:
    - develop
    - pr
    hooks:
      prepare_input:
      - DevelopmentDeliveryExecutor
      publish_output:
      - DevelopmentDeliveryOutcome
    human_tasks:
    - trigger: confirm_output
      task_id: delivery-outcome
      feedback_delivery: {artifact: workflow_feedback, source_kind: delivery, todo_source: workflow_feedback, todo_id_prefix: DLV}
      outcomes:
        confirm_cleanup: _done
        confirm_archive: _done
        confirm: _done
        revise: deliver
    - trigger: need_clarification
      task_id: delivery-recovery
      outcomes:
        submit: deliver
    - trigger: need_permission
      task_id: delivery-permission
      outcomes:
        submit: deliver
    'on':
      confirm_output: deliver
      need_clarification: deliver
      need_permission: deliver
      manual_handoff: develop

entry_point: develop
