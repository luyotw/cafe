playbook:
  id: subagent-flow
  name: "Subagent Flow"
  conversation_locale: en-US
  applicability:
    summary: "Joint requirements and implementation planning for focused software changes that benefit from subagent discussion."
    use_when:
      - "Requirements and implementation direction need to be resolved together by one owner."
      - "A focused change benefits from a planning partner and detail/scope review."
    avoid_when:
      - "The requested behavior and implementation boundary are already confirmed."
      - "Requirements need independent ownership or a separately reusable specification."
      - "Acceptance requires an independent QA phase."

behavior:
  completion: status_code
  allow_issue_decomposition: true

skills:
  workflow:
    shared: [cafe-workflow-common, cafe-github_sync]
    steps:
      develop:
        mode: extend
        skills: [cafe-develop_subagent_review]
  chat:
    shared: [cafe-common-chat-handoff, cafe-chat-develop-change, cafe-chat-spec-revision, cafe-chat-plan-revision, cafe-chat-alignment-decision]

roles:
  developer:
    description: "Requirements and implementation owner"
    default_agent: "David"
    default_cli: "claude"

commands:
  prepare:
    fields:
      - id: input_method
        type: enum
        label: "Input method"
        help: "Choose how the requirements for joint specification and planning are provided."
        write: spec_plan.input_method
        default: manual
        required: true
        show_when:
          github_repo: true
        choices:
          - value: manual
            label: "Manual input"
          - value: github
            label: "GitHub issue"
      - id: github_issue_id
        type: text
        label: "GitHub issue ID or URL"
        write: spec_plan.issue_id
        normalize: github_issue
        show_when:
          issue_id_present: true

steps:
  spec_plan:
    type: skill
    skill: cafe-spec_plan
    handoff_label: Revise requirements and implementation plan
    role: developer
    assignee_type: agent
    input_artifacts: [plan]
    output_artifact: plan
    todo_identity_input_artifact: plan
    valid_intents: [confirmed, ready_for_review, need_clarification, need_permission, needs_changes]
    initial_input:
      providers: [manual_text, github_issue]
      bind:
        artifact: plan
        prompt_context: user_input
    human_tasks:
      - trigger: confirm_output
        task_id: output-review
        outcomes: {confirm: develop, revise: spec_plan}
      - trigger: need_clarification
        task_id: clarification-answers
        outcomes: {submit: spec_plan}
      - trigger: need_permission
        task_id: permission-feedback
        outcomes: {submit: spec_plan}
      - trigger: manual_handoff
        task_id: discussion-recovery
        outcomes: {submit: spec_plan}
    allowed_tools: [Read, Edit, Write, Grep, Glob, Bash, Agent, WebFetch, WebSearch]
    hooks:
      prepare_input: [InitialInputProviderResolver, UserInputCollector]
    "on":
      await_agent: develop
      confirm_output: spec_plan
      need_clarification: spec_plan
      need_permission: spec_plan
      manual_handoff: spec_plan

  develop:
    type: skill
    skill: cafe-develop
    handoff_label: Continue implementation
    role: developer
    assignee_type: agent
    input_artifacts: [plan, pr_result, workflow_feedback, delivery_result]
    output_artifact: code
    workspace_artifact: workspace
    human_tasks:
      - trigger: need_clarification
        task_id: clarification-feedback
        outcomes: {submit: develop}
      - trigger: need_permission
        task_id: permission-answers
        outcomes: {submit: develop}
      - trigger: no_changes_needed
        task_id: no-change-decision
        outcomes: {agree: develop, disagree: develop}
    allowed_tools: [Read, Edit, Write, Grep, Glob, Bash, Agent, WebFetch, WebSearch]
    allowed_goto: [spec_plan]
    hooks:
      prepare_input: [UserInputCollector]
      after_execute: [NoChangesNeededHandler, PermissionRetryHandler]
    "on":
      await_agent: pr
      manual_handoff: develop
      need_clarification: develop
      need_permission: develop
      no_changes_needed: develop

  pr:
    handoff_label: Revise PR content
    type: skill
    skill: cafe-pr
    handoff_label: Refresh PR output
    role: developer
    assignee_type: agent
    input_artifacts:
    - plan
    - code
    - workspace
    - workflow_feedback
    workspace_input_artifact: workspace
    output_artifact: pr_result
    behavior:
      completion: baton
      publish_confirmation: true
      feedback_target: pr
      feedback_artifact: workflow_feedback
      feedback_source_kind: github_pr
      feedback_todo_source: pr_comment
      feedback_todo_id_prefix: PRC
      context_providers:
      - git_history
      - local_review
    capability_requests:
    - cafe.pr.publish
    allowed_tools:
    - Read
    - Edit
    - Write
    - Grep
    - Glob
    allowed_goto:
    - develop
    hooks:
      prepare_input:
      - GitHubPRCreator
      - GitHubPRFeedbackSource
      - UserInputCollector
      publish_output:
      - GitHubPRCreator
      - LocalReviewContextProvider
      - PRLinkOpener
    human_tasks:
    - trigger: confirm_output
      task_id: pr-review
      mandatory_confirmation: false
      feedback_delivery: {artifact: workflow_feedback, source_kind: local_review, todo_source: workflow_feedback, todo_id_prefix: WF}
      outcomes:
        fix_now: pr
        confirm: deliver
    - trigger: need_clarification
      task_id: pr-details
      outcomes:
        submit: pr
    'on':
      confirm_output: pr
      need_permission: pr
      manual_handoff: develop
      need_clarification: pr
  deliver:
    type: skill
    skill: cafe-deliver_development
    handoff_label: Recover delivery actions
    role: developer
    assignee_type: agent
    input_artifacts:
    - pr_result
    - workspace
    - workflow_feedback
    workspace_input_artifact: workspace
    output_artifact: delivery_result
    delivery:
      actions_artifact: delivery_actions
      result_artifact: delivery_result
      approval_step: deliver
      approval_task: delivery-review
      result_task: delivery-outcome
      correction_step: develop
      publication_artifact: pr_result
    behavior:
      completion: baton
      feedback_target: develop
      feedback_artifact: delivery_result
      feedback_source_kind: delivery
      feedback_todo_source: workflow_feedback
      feedback_todo_id_prefix: DLV
    capability_requests:
    - cafe.github.pr.merge
    - cafe.branch.integrate
    - cafe.github.issue.create
    allowed_tools:
    - Read
    - Edit
    - Write
    - Grep
    - Glob
    allowed_goto:
    - develop
    - pr
    hooks:
      prepare_input:
      - DevelopmentDeliveryExecutor
      publish_output:
      - DevelopmentActionContext
      - DevelopmentDeliveryOutcome
    human_tasks:
    - trigger: confirm_output
      task_id: delivery-outcome
      mandatory_confirmation: false
      feedback_delivery: {artifact: workflow_feedback, source_kind: delivery, todo_source: workflow_feedback, todo_id_prefix: DLV}
      outcomes:
        confirm: _done
        revise: deliver
    - trigger: need_clarification
      task_id: delivery-recovery
      outcomes:
        submit: deliver
    - trigger: need_permission
      task_id: delivery-review
      outcomes:
        fix_now: deliver
        integrate_selected: deliver
        integrate_only: deliver
        review_only: deliver
      feedback_delivery: {artifact: workflow_feedback, source_kind: delivery, todo_source: workflow_feedback, todo_id_prefix: DLV}
    'on':
      confirm_output: deliver
      need_clarification: deliver
      need_permission: deliver
      manual_handoff: develop

entry_point: spec_plan
