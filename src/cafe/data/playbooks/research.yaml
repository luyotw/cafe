playbook:
  id: research
  name: "Research Workflow (question -> collect -> synthesize -> report)"
  conversation_locale: en-US
  applicability:
    summary: "Evidence-led investigation for an open question that needs a sourced conclusion."
    use_when:
      - "The primary outcome is a defensible answer assembled from evaluated evidence."
      - "The question and evidence quality need explicit research ownership."
    avoid_when:
      - "The confirmed outcome is direct software implementation or incident mitigation."
      - "The source material is settled and only editorial production remains."

behavior:
  completion: status_code

skills:
  workflow:
    shared: [cafe-workflow-common, cafe-github_sync]
  chat:
    shared: [cafe-common-chat-handoff, cafe-chat-develop-change, cafe-chat-spec-revision, cafe-chat-plan-revision, cafe-chat-alignment-decision]

roles:
  researcher:
    description: "Research and analysis"
    default_agent: "Morgan"
    default_cli: "claude"

commands:
  prepare:
    prompt_for_spec_plan_config: false

steps:
  question:
    type: skill
    skill: cafe-research_question
    role: researcher
    handoff_label: "Refine research question"
    chat_role: researcher
    assignee_type: agent
    input_artifacts: [research_notes]
    output_artifact: research_question_brief
    human_tasks:
      - trigger: need_clarification
        task_id: clarification-feedback
        outcomes: {submit: question}
    valid_intents:
      - confirmed
      - need_clarification
    allowed_tools: [Read, Grep, Glob, WebFetch, WebSearch]
    "on":
      await_agent: collect
      need_clarification: question

  collect:
    type: skill
    skill: cafe-research_collect
    role: researcher
    handoff_label: "Continue evidence collection"
    chat_role: researcher
    assignee_type: agent
    input_artifacts: [research_question_brief, research_synthesis]
    output_artifact: research_notes
    behavior:
      feedback_routes:
        question: {artifact: research_notes, source_kind: research_notes, todo_source: notes, todo_id_prefix: RNOTE}
    human_tasks:
      - trigger: need_clarification
        task_id: clarification-feedback
        outcomes: {submit: collect}
    valid_intents:
      - confirmed
      - need_clarification
    allowed_tools: [Read, Grep, Glob, WebFetch, WebSearch]
    "on":
      await_agent: synthesize
      need_clarification: collect
      manual_handoff: question

  synthesize:
    type: skill
    skill: cafe-research_synthesize
    role: researcher
    handoff_label: "Revise research synthesis"
    chat_role: researcher
    assignee_type: agent
    input_artifacts: [research_question_brief, research_notes, research_report_doc]
    output_artifact: research_synthesis
    behavior:
      feedback_routes:
        collect: {artifact: research_synthesis, source_kind: research_synthesis, todo_source: synthesis, todo_id_prefix: RSYN}
    human_tasks:
      - trigger: need_clarification
        task_id: clarification-feedback
        outcomes: {submit: synthesize}
    valid_intents:
      - confirmed
      - need_clarification
    allowed_tools: [Read, Grep, Glob, WebFetch, WebSearch]
    "on":
      await_agent: report
      need_clarification: synthesize
      manual_handoff: collect

  report:
    type: skill
    skill: cafe-research_report
    role: researcher
    handoff_label: "Update research report"
    chat_role: researcher
    assignee_type: agent
    input_artifacts: [research_question_brief, research_notes, research_synthesis]
    output_artifact: research_report_doc
    behavior:
      feedback_routes:
        synthesize: {artifact: research_report_doc, source_kind: research_report, todo_source: report, todo_id_prefix: RPT}
    human_tasks:
      - trigger: need_clarification
        task_id: clarification-feedback
        outcomes: {submit: report}
    valid_intents:
      - confirmed
      - need_clarification
    allowed_tools: [Read, Edit, Write, Grep, Glob]
    "on":
      await_agent: _done
      need_clarification: report
      manual_handoff: synthesize

entry_point: question
