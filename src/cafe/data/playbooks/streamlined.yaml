playbook:
  id: streamlined
  name: Streamlined Development
  conversation_locale: en-US
  applicability:
    summary: Compact approved file scope, one native reviewer and exact delivery for
      clear changes.
    use_when:
    - The request and implementation boundary are already clear.
    - A single independent native review is appropriate.
    avoid_when:
    - Investigation or dedicated specification and planning are required.
    - The selected provider cannot establish native review checkpoint evidence.
behavior:
  completion: status_code
  allow_issue_decomposition: true
skills:
  workflow:
    shared:
    - cafe-workflow-common
    - cafe-github_sync
    steps:
      develop:
        mode: extend
        skills:
        - cafe-develop_single_review
  chat:
    shared:
    - cafe-common-chat-handoff
    - cafe-chat-develop-change
    - cafe-chat-alignment-decision
roles:
  developer:
    description: Developer
    default_agent: David
    default_cli: claude
commands:
  prepare:
    fields:
    - id: input_method
      type: enum
      label: Input method
      help: Choose how the direct-development requirements are provided.
      write: develop.input_method
      default: manual
      required: true
      show_when:
        github_repo: true
      choices:
      - value: manual
        label: Manual input
      - value: github
        label: GitHub issue
    - id: github_issue_id
      type: text
      label: GitHub issue ID or URL
      write: develop.issue_id
      normalize: github_issue
      show_when:
        issue_id_present: true
steps:
  develop:
    type: skill
    skill: cafe-develop
    handoff_label: Continue implementation
    role: developer
    assignee_type: agent
    input_artifacts:
    - delivery_result
    - workflow_feedback
    output_artifact: code
    workspace_artifact: workspace
    initial_input:
      providers:
      - manual_text
      - github_issue
      bind:
        prompt_context: user_input
    human_tasks:
    - trigger: need_clarification
      task_id: clarification-feedback
      outcomes:
        submit: develop
    - trigger: need_permission
      task_id: permission-answers
      outcomes:
        submit: develop
    - trigger: no_changes_needed
      task_id: no-change-decision
      outcomes:
        agree: develop
        disagree: develop
    - trigger: manual_handoff
      task_id: iteration-limit
      outcomes:
        resume: develop
    allowed_tools:
    - Read
    - Edit
    - Write
    - Grep
    - Glob
    - Bash
    - Agent
    - WebFetch
    - WebSearch
    hooks:
      prepare_input:
      - InitialInputProviderResolver
      - UserInputCollector
      after_execute:
      - NoChangesNeededHandler
      - PermissionRetryHandler
    'on':
      await_agent: deliver
      manual_handoff: develop
      need_clarification: develop
      need_permission: develop
      no_changes_needed: develop
    execution:
      checkpoints:
      - resume
      - before_review
      review_policy: single_native
      review_evidence_artifact: native_review.json
    behavior:
      completion: baton
    max_attempts_per_cycle: 3
  deliver:
    type: skill
    skill: cafe-deliver
    role: developer
    assignee_type: agent
    input_artifacts:
    - code
    - workspace
    workspace_input_artifact: workspace
    output_artifact: delivery_result
    behavior:
      completion: baton
    execution:
      checkpoints:
      - resume
      - before_delivery
      delivery_evidence_artifact: delivery_readiness.json
    allowed_tools:
    - Read
    - Grep
    - Glob
    - Bash
    - Write
    allowed_goto:
    - develop
    human_tasks:
    - trigger: need_clarification
      task_id: clarification-feedback
      outcomes:
        submit: deliver
    - trigger: need_permission
      task_id: permission-answers
      outcomes:
        submit: deliver
    'on':
      manual_handoff: develop
      need_clarification: deliver
      need_permission: deliver
      workflow_complete: _done
entry_point: develop
contract:
  mode: compact
