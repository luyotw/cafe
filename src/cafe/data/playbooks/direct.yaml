playbook:
  id: direct
  name: "Direct Development"
  conversation_locale: en-US
  applicability:
    summary: "Focused implementation with independent code review for already-clear work."
    use_when:
      - "The requested behavior and implementation boundary are already confirmed."
      - "Independent code review is sufficient for the acceptance risk."
    avoid_when:
      - "Requirements or solution design still need dedicated specification or planning."
      - "Acceptance requires an independent QA owner beyond code review."

behavior:
  completion: status_code
  allow_issue_decomposition: true

skills:
  workflow:
    shared: [cafe-workflow-common, cafe-github_sync]
  chat:
    shared: [cafe-common-chat-handoff, cafe-chat-develop-change, cafe-chat-spec-revision, cafe-chat-plan-revision, cafe-chat-alignment-decision]

roles:
  developer:
    description: "Developer"
    default_agent: "David"
    default_cli: "claude"
  reviewer:
    description: "Code Reviewer"
    default_agent: "Richard"
    default_cli: "gemini"

commands:
  prepare:
    fields:
      - id: input_method
        type: enum
        label: "Input method"
        help: "Choose how the direct-development requirements are provided."
        write: develop.input_method
        default: manual
        required: true
        show_when:
          github_repo: true
        choices:
          - value: manual
            label: "Manual input"
          - value: github
            label: "GitHub issue"
      - id: github_issue_id
        type: text
        label: "GitHub issue ID or URL"
        write: develop.issue_id
        normalize: github_issue
        show_when:
          issue_id_present: true

steps:
  develop:
    type: skill
    skill: cafe-develop
    handoff_label: Continue implementation
    role: developer
    assignee_type: agent
    input_artifacts: [review_feedback, pr_result, workflow_feedback, delivery_result]
    output_artifact: code
    workspace_artifact: workspace
    initial_input:
      providers: [manual_text, github_issue]
      bind:
        prompt_context: user_input
    human_tasks:
      - trigger: need_clarification
        task_id: clarification-feedback
        outcomes: {submit: develop}
      - trigger: need_permission
        task_id: permission-answers
        outcomes: {submit: develop}
      - trigger: no_changes_needed
        task_id: no-change-decision
        outcomes: {agree: review, disagree: develop}
    allowed_tools: [Read, Edit, Write, Grep, Glob, Bash, WebFetch, WebSearch]
    hooks:
      prepare_input: [InitialInputProviderResolver, UserInputCollector]
      after_execute: [NoChangesNeededHandler, PermissionRetryHandler]
    "on":
      await_agent: review
      manual_handoff: develop
      need_clarification: develop
      need_permission: develop
      no_changes_needed: review

  review:
    type: skill
    skill: cafe-review
    role: reviewer
    behavior:
      runtime_tool_grants: [web_research, git_inspection]
    assignee_type: agent
    input_artifacts: [code, workspace, workflow_feedback]
    workspace_input_artifact: workspace
    output_artifact: review_feedback
    human_tasks:
      - trigger: need_clarification
        task_id: clarification-feedback
        outcomes: {submit: review}
      - trigger: manual_handoff
        task_id: iteration-limit
        outcomes: {resume: review}
    allowed_tools: [Read, Grep, Glob, "Bash(git:*)"]
    max_attempts_per_cycle: 5
    allowed_goto: [develop]
    hooks:
      prepare_input: [UserInputCollector]
      before_execute: [NewChangesGate]
    "on":
      await_agent: pr
      manual_handoff: develop
      need_clarification: review
      need_permission: review

  pr:
    handoff_label: Revise PR content
    type: skill
    skill: cafe-pr
    role: developer
    assignee_type: agent
    input_artifacts:
    - code
    - workspace
    - review_feedback
    - workflow_feedback
    workspace_input_artifact: workspace
    output_artifact: pr_result
    behavior:
      completion: baton
      publish_confirmation: true
      feedback_target: pr
      feedback_artifact: workflow_feedback
      feedback_source_kind: github_pr
      feedback_todo_source: pr_comment
      feedback_todo_id_prefix: PRC
      context_providers:
      - git_history
      - local_review
    capability_requests:
    - cafe.pr.publish
    allowed_tools:
    - Read
    - Edit
    - Write
    - Grep
    - Glob
    allowed_goto:
    - develop
    hooks:
      prepare_input:
      - GitHubPRCreator
      - GitHubPRFeedbackSource
      - UserInputCollector
      publish_output:
      - GitHubPRCreator
      - LocalReviewContextProvider
      - PRLinkOpener
    human_tasks:
    - trigger: confirm_output
      task_id: pr-review
      outcomes:
        fix_now: pr
        confirm: deliver
    - trigger: need_clarification
      task_id: pr-details
      outcomes:
        submit: pr
    'on':
      confirm_output: pr
      need_permission: pr
      manual_handoff: develop
      need_clarification: pr
  deliver:
    type: skill
    skill: cafe-deliver_development
    handoff_label: Recover delivery actions
    role: developer
    assignee_type: agent
    input_artifacts:
    - review_feedback
    - pr_result
    - workspace
    - workflow_feedback
    workspace_input_artifact: workspace
    output_artifact: delivery_result
    delivery:
      actions_artifact: delivery_actions
      result_artifact: delivery_result
      approval_step: deliver
      approval_task: delivery-review
      result_task: delivery-outcome
      correction_step: develop
      proposals_artifact: review_feedback
      publication_artifact: pr_result
    behavior:
      completion: baton
      feedback_target: develop
      feedback_artifact: delivery_result
      feedback_source_kind: delivery
      feedback_todo_source: workflow_feedback
      feedback_todo_id_prefix: DLV
    capability_requests:
    - cafe.github.pr.merge
    - cafe.branch.integrate
    - cafe.github.issue.create
    allowed_tools:
    - Read
    - Edit
    - Write
    - Grep
    - Glob
    allowed_goto:
    - develop
    - pr
    hooks:
      prepare_input:
      - DevelopmentDeliveryExecutor
      publish_output:
      - DevelopmentActionContext
      - DevelopmentDeliveryOutcome
    human_tasks:
    - trigger: confirm_output
      task_id: delivery-outcome
      feedback_delivery: {artifact: workflow_feedback, source_kind: delivery, todo_source: workflow_feedback, todo_id_prefix: DLV}
      outcomes:
        confirm_cleanup: _done
        confirm_archive: _done
        confirm: _done
        revise: deliver
    - trigger: need_clarification
      task_id: delivery-recovery
      outcomes:
        submit: deliver
    - trigger: need_permission
      task_id: delivery-review
      outcomes:
        fix_now: deliver
        integrate_selected: deliver
        integrate_only: deliver
        review_only: deliver
      feedback_delivery: {artifact: workflow_feedback, source_kind: delivery, todo_source: workflow_feedback, todo_id_prefix: DLV}
    'on':
      confirm_output: deliver
      need_clarification: deliver
      need_permission: deliver
      manual_handoff: develop

entry_point: develop
