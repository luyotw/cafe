id: cafe.pr.publish
version: 1
implementation: sync_pr
arguments:
  required:
    - output
  properties:
    output:
      type: string
    base:
      type: string
outputs:
  required:
    - pr_url
    - pr_number
  properties:
    pr_url:
      type: string
    pr_number:
      type: string
    action:
      type: string
effects:
  writes:
    - request_output
    - .git
    - issue_dir
  network_destinations:
    - github.com
    - api.github.com
  browser_open: []
credentials:
  - gh
permissions:
  network:
    - github.com
    - api.github.com
  writes:
    - request_output
    - .git
    - issue_dir
idempotency: update_in_place
risk: medium
approval: not_required
policy: allow
setup_questions:
  - setting: pr.auto_create
    prompt: PR publication choice (publication does not authorize merge or issue closure)
    choices:
      - value: true
        outcome: Push the feature branch and create or update the PR after local material and authorization succeed; review receives a verified PR URL.
        prepare_args: [--auto-create-pr]
      - value: false
        outcome: "Publication mode: local-only. No PR URL exists."
        prepare_args: [--no-auto-create-pr]
