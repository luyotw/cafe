id: cafe.slack.workflow_event
version: 1
implementation: notify_slack_workflow_event
arguments:
  required: [repository, workflow_id, event_id, event_type, step]
  properties:
    repository: {type: string}
    workflow_id: {type: string}
    event_id: {type: string}
    event_type:
      type: string
      enum: [phase_boundary, human_task, error, permission, completion]
    step: {type: string}
outputs:
  required: [delivered, workflow_id, event_id]
  properties:
    delivered: {type: boolean}
    workflow_id: {type: string}
    event_id: {type: string}
effects:
  writes: []
  network_destinations: [hooks.slack.com]
  browser_open: []
credentials: [slack_human_task_webhook]
permissions:
  network: [hooks.slack.com]
idempotency: unsafe
risk: medium
approval: not_required
policy: allow
