workspace.correction: '工作目錄完成檢查未通過：{reason}

  已使用修正機會：{consumed}；本次返回後剩餘：{remaining}。

  請核對每項修改的來源並保留執行前已有的工作，只在原任務範圍與授權內處理。未提交檔案不代表授權你暫存、提交、stash、還原或刪除。若檔案處置需要人決定，沿用澄清或權限交接；不要推測人的回答。保留原 phase、iteration、CLI、model、session、工具、目錄與權限。重新驗證目前成果、checklist 與 Todo evidence，並重新提交一般 handoff。'
