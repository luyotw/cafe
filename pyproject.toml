[project]
name = "cafe-engine"
version = "0.3.2"
description = "CLI Agent Flow Engine - Automated development workflow with AI agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "textual>=0.47.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "prompt_toolkit>=3.0.0",
    "InquirerPy>=0.3.4",
    "tomli>=2.0.0; python_version<'3.11'"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
]

[project.scripts]
cafe = "cafe.ui.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cafe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"
markers = [
    "integration: Integration tests that use real components but may mock external dependencies",
    "e2e: End-to-end tests that run the full system including CLI commands",
    "slow: Tests that take a long time to run or cost money (e.g., LLM API calls)",
]

[tool.coverage.run]
source = ["cafe"]

[tool.coverage.report]
fail_under = 75

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
